# Ingress ArgoCD — à appliquer à l'étape B2 du guide (PAS géré par Argo lui-même :
# le serveur doit exister avant de pouvoir se synchroniser lui-même).
# Remplacer le placeholder par sed à l'étape B2 (argocd.<PUBLIC_IP>.nip.io).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ARGOCD_HOST_PLACEHOLDER
      secretName: argocd-tls
  rules:
    - host: ARGOCD_HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
